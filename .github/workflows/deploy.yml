name: Build and deploy config-server with blue green

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy this commit or roll back to the previous healthy release
        type: choice
        options: [deploy, rollback]
        default: deploy

concurrency:
  group: deploy-config-server-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_USERNAME: ${{ secrets.THE_GITHUB_USERNAME }}
      GITHUB_TOKEN: ${{ secrets.THE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4
        if: inputs.operation != 'rollback'
        with:
          distribution: temurin
          java-version: '23'
      - name: Test deployment safety
        run: python3 -m unittest discover -s deploy/tests
      - name: Build and test application
        if: inputs.operation != 'rollback'
        run: |
          mvn -B verify
      - name: Build immutable Docker image
        if: inputs.operation != 'rollback'
        run: |
          docker build -t config-server:${{ github.sha }} .
          docker save config-server:${{ github.sha }} | gzip > image.tar.gz
      - name: Transfer release and deployment script
        if: github.event_name != 'pull_request' && inputs.operation != 'rollback'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'image.tar.gz,deploy/blue_green.py'
          target: '/tmp/knitty-deploy/config-server/${{ github.sha }}'
      - name: Transfer rollback controller
        if: github.event_name != 'pull_request' && inputs.operation == 'rollback'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'deploy/blue_green.py'
          target: '/tmp/knitty-deploy/config-server/${{ github.sha }}'
      - name: Switch healthy blue green release
        if: github.event_name != 'pull_request' && inputs.operation != 'rollback'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GITHUB_USERNAME,GITHUB_TOKEN
          command_timeout: 40m
          script: |
            set -eu
            release_dir='/tmp/knitty-deploy/config-server/${{ github.sha }}'
            trap 'rm -f -- "$release_dir/image.tar.gz"' EXIT
            docker load --input "$release_dir/image.tar.gz"
            python3 "$release_dir/deploy/blue_green.py" deploy --service config-server --image config-server:${{ github.sha }}
      - name: Restore previous healthy release
        if: github.event_name != 'pull_request' && inputs.operation == 'rollback'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -eu
            python3 '/tmp/knitty-deploy/config-server/${{ github.sha }}/deploy/blue_green.py' rollback --service config-server
